<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cool Roofing Predictor{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
  <style>
    :root {
      --primary: #1a6b4a; --accent: #27ae60; --bg: #f4f7f5; --card: #ffffff;
      --text: #1e2a23; --muted: #6c7c70; --border: #d0ddd4;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }
    .navbar { background: var(--primary) !important; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { color: var(--accent) !important; }
    .nav-link.active { color: #a8f0c6 !important; font-weight: 600; }
    .navbar-toggler { border-color: rgba(255,255,255,.4); }
    .navbar-toggler-icon { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255,255,255,0.9%29' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }
    .card { border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .kpi-card { border-left: 4px solid var(--accent); }
    .kpi-val { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; color: var(--primary); word-break: break-all; }
    .kpi-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .btn-primary { background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: #145238; border-color: #145238; }
    .section-title { font-size: 1rem; font-weight: 600; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: 16px; }
    .result-badge { background: #e8f5ee; color: var(--primary); border-radius: 8px; padding: 12px 16px; }
    .result-badge .val { font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 700; word-break: break-all; }
    table thead { background: var(--primary); color: #fff; }
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .spinner-border { color: var(--accent); }
    #toast-container { position: fixed; bottom: 16px; right: 16px; z-index: 9999; max-width: calc(100vw - 32px); }
    @media (max-width: 576px) {
      .container-fluid { padding-left: 12px !important; padding-right: 12px !important; }
      .card { border-radius: 8px; }
      h2 { font-size: 1.4rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/">🏠 Cool Roofing</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon" style="filter:invert(1)"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link {% if page=='home' %}active{% endif %}" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='dashboard' %}active{% endif %}" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='predict' %}active{% endif %}" href="/predict">Predict</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='batch' %}active{% endif %}" href="/batch">Batch</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='recommend' %}active{% endif %}" href="/recommend">Recommend</a></li>
        <li class="nav-item"><a class="nav-link" href="/docs" target="_blank">API Docs</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-fluid px-4 py-4">{% block content %}{% endblock %}</div>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showToast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `alert alert-${type} shadow mb-2`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function setLoading(btn, loading) {
  if (loading) { btn.dataset.orig = btn.innerHTML; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Running…'; btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.orig; btn.disabled = false; }
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
