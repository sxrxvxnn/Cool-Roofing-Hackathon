<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117" rx="14"/>
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#30363d" stroke-width="1" rx="14"/>

  <!-- Title -->
  <text x="400" y="38" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Model Selection — Performance Comparison</text>
  <line x1="40" y1="50" x2="760" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- Legend -->
  <rect x="440" y="62" width="12" height="12" fill="#f59e0b" rx="2"/>
  <text x="457" y="73" fill="#8b949e" font-size="11">XGBoost — selected</text>
  <rect x="590" y="62" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="607" y="73" fill="#8b949e" font-size="11">Random Forest</text>
  <rect x="700" y="62" width="12" height="12" fill="#6e7681" rx="2"/>
  <text x="717" y="73" fill="#8b949e" font-size="11">Baseline</text>

  <!-- ── REGRESSION ── -->
  <text x="40" y="100" fill="#58a6ff" font-size="11" font-weight="bold" letter-spacing="1">REGRESSION  (R² score · higher = better)</text>

  <!-- Cost label -->
  <text x="40" y="125" fill="#e6edf3" font-size="13" font-weight="600">Installation Cost</text>

  <!-- Cost XGBoost bar -->
  <text x="40" y="144" fill="#f59e0b" font-size="10">XGBoost</text>
  <rect x="185" y="132" width="480" height="16" fill="#161b22" rx="3"/>
  <rect x="185" y="132" width="0" height="16" fill="#f59e0b" rx="3">
    <animate attributeName="width" from="0" to="472" dur="1.4s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="672" y="144" fill="#f59e0b" font-size="11" font-weight="bold">0.9843 ✓</text>

  <!-- Cost RF bar -->
  <text x="40" y="162" fill="#3b82f6" font-size="10">Random Forest</text>
  <rect x="185" y="151" width="480" height="12" fill="#161b22" rx="3"/>
  <rect x="185" y="151" width="0" height="12" fill="#3b82f660" rx="3">
    <animate attributeName="width" from="0" to="470" dur="1.4s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="672" y="161" fill="#3b82f680" font-size="10">0.9797</text>

  <!-- Cost Baseline bar -->
  <text x="40" y="178" fill="#6e7681" font-size="10">Baseline (mean)</text>
  <rect x="185" y="168" width="480" height="8" fill="#161b22" rx="3"/>
  <rect x="185" y="168" width="0" height="8" fill="#6e768140" rx="3">
    <animate attributeName="width" from="0" to="2" dur="0.5s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="672" y="176" fill="#6e7681" font-size="10">≈ 0.0</text>

  <line x1="40" y1="190" x2="760" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Temp Drop -->
  <text x="40" y="212" fill="#e6edf3" font-size="13" font-weight="600">Temperature Drop</text>
  <text x="40" y="229" fill="#3b82f6" font-size="10">Random Forest</text>
  <rect x="185" y="218" width="480" height="16" fill="#161b22" rx="3"/>
  <rect x="185" y="218" width="0" height="16" fill="#3b82f6" rx="3">
    <animate attributeName="width" from="0" to="449" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="672" y="230" fill="#3b82f6" font-size="11" font-weight="bold">0.9350 ✓</text>

  <line x1="40" y1="248" x2="760" y2="248" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Units Saved -->
  <text x="40" y="270" fill="#e6edf3" font-size="13" font-weight="600">Monthly Units Saved</text>
  <text x="40" y="287" fill="#3b82f6" font-size="10">Random Forest</text>
  <rect x="185" y="276" width="480" height="16" fill="#161b22" rx="3"/>
  <rect x="185" y="276" width="0" height="16" fill="#3b82f6" rx="3">
    <animate attributeName="width" from="0" to="453" dur="1.4s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="672" y="288" fill="#3b82f6" font-size="11" font-weight="bold">0.9440 ✓</text>

  <!-- ── CLASSIFICATION ── -->
  <line x1="40" y1="306" x2="760" y2="306" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="324" fill="#58a6ff" font-size="11" font-weight="bold" letter-spacing="1">CLASSIFICATION  (accuracy · higher = better)</text>

  <!-- High Rating -->
  <text x="40" y="347" fill="#e6edf3" font-size="13" font-weight="600">High Rating ≥ 4★</text>
  <text x="40" y="365" fill="#3b82f6" font-size="10">Random Forest</text>
  <rect x="185" y="353" width="480" height="16" fill="#161b22" rx="3"/>
  <rect x="185" y="353" width="0" height="16" fill="#3b82f6" rx="3">
    <animate attributeName="width" from="0" to="314" dur="1.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="672" y="365" fill="#3b82f6" font-size="11" font-weight="bold">65.5% ✓</text>
  <!-- Baseline -->
  <text x="40" y="380" fill="#6e7681" font-size="10">Baseline (majority class)</text>
  <rect x="185" y="371" width="480" height="8" fill="#161b22" rx="3"/>
  <rect x="185" y="371" width="0" height="8" fill="#6e768140" rx="3">
    <animate attributeName="width" from="0" to="269" dur="0.8s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="672" y="379" fill="#6e7681" font-size="10">56.1%</text>

  <line x1="40" y1="393" x2="760" y2="393" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Referral -->
  <text x="40" y="415" fill="#e6edf3" font-size="13" font-weight="600">Customer Referral</text>
  <text x="40" y="433" fill="#3b82f6" font-size="10">Random Forest</text>
  <rect x="185" y="421" width="480" height="16" fill="#161b22" rx="3"/>
  <rect x="185" y="421" width="0" height="16" fill="#3b82f6" rx="3">
    <animate attributeName="width" from="0" to="298" dur="1.2s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="672" y="433" fill="#3b82f6" font-size="11" font-weight="bold">62.0% ✓</text>
  <!-- Baseline -->
  <text x="40" y="449" fill="#6e7681" font-size="10">Baseline (majority class)</text>
  <rect x="185" y="440" width="480" height="8" fill="#161b22" rx="3"/>
  <rect x="185" y="440" width="0" height="8" fill="#6e768140" rx="3">
    <animate attributeName="width" from="0" to="274" dur="0.8s" begin="1.05s" fill="freeze"/>
  </rect>
  <text x="672" y="448" fill="#6e7681" font-size="10">57.1%</text>

  <!-- Bottom note -->
  <text x="400" y="480" fill="#484f58" font-size="10" text-anchor="middle">All scores on held-out test set (371 rows, never seen during training)</text>
</svg>
